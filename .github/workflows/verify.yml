name: Verify project

on:
  workflow_call:
    inputs:
      upload_distribution:
        description: Upload the verified wheel and source distribution
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install fish and nushell (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y fish
          nu_archive="$RUNNER_TEMP/nu-0.101.0-x86_64-unknown-linux-gnu.tar.gz"
          nu_directory="$RUNNER_TEMP/nushell"
          curl -fsSLo "$nu_archive" https://github.com/nushell/nushell/releases/download/0.101.0/nu-0.101.0-x86_64-unknown-linux-gnu.tar.gz
          echo "7149728c779b5d7e7f86e34f36fd31332f7677df3e9a47b5744a1e1756d3ce76  $nu_archive" | sha256sum --check --strict
          mkdir -p "$nu_directory"
          tar xzf "$nu_archive" -C "$nu_directory"
          sudo install -m 0755 "$nu_directory/nu-0.101.0-x86_64-unknown-linux-gnu/nu" /usr/local/bin/nu

      - name: Install fish and nushell (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install fish nushell

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Type check
        run: uv run --frozen pyright

      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: >-
          uv run --frozen pytest
          --cov=porterminal
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Test
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        run: uv run --frozen pytest

      - name: Upload backend coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: error

      - name: Verify CLI
        run: uv run --frozen ptn --help

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Test with coverage
        run: npm run test:coverage --prefix frontend

      - name: Upload frontend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error

      - name: Type check tests
        run: npm run test:typecheck --prefix frontend

      - name: Build
        run: npm run build --prefix frontend

      - name: Verify packaged assets are current
        run: git diff --exit-code -- porterminal/static

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npm run test:browser --prefix frontend

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up protected browser test backend
        run: |
          uv python install 3.12
          uv sync --frozen --python 3.12

      - name: Protected-path browser integration test
        run: npm run test:browser:protected --prefix frontend

  minimum-dependencies:
    name: Minimum direct dependencies (Windows, Python 3.13)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Resolve minimum direct dependencies
        run: uv lock --resolution lowest-direct --upgrade --python 3.13

      - name: Install minimum direct dependencies
        run: uv sync --frozen --python 3.13

      - name: Test declared lower bounds
        run: uv run --frozen pytest

      - name: Verify CLI with declared lower bounds
        run: uv run --frozen ptn --help

  distribution:
    name: Distribution
    needs: [backend, frontend, minimum-dependencies]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build distributions
        run: uv build

      - name: Verify fresh consumer installation
        run: uv run --frozen --python 3.12 python scripts/verify_distribution.py --python 3.12

      - name: Upload verified distributions
        if: inputs.upload_distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

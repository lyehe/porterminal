[project]
name = "ptn"
dynamic = ["version"]
description = "Web-based terminal accessible from phone via Cloudflare Tunnel"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.12"
keywords = ["terminal", "web", "cloudflare", "tunnel", "pty", "mobile", "xterm", "websocket"]
authors = [
    {name = "Porterminal Contributors"}
]
maintainers = [
    {name = "Porterminal Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: System :: Shells",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
]
dependencies = [
    "fastapi>=0.141.1",
    # FastAPI's supported range still includes Starlette releases affected by
    # request parsing, host validation, and Windows StaticFiles advisories.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.24.0",
    # 2.0.15 is the first release with wheels for every advertised Python
    # version (3.12 and 3.13), avoiding an unexpected local Rust build.
    "pywinpty>=2.0.15; sys_platform == 'win32'",
    # 6.0.2 adds prebuilt CPython 3.13 wheels on supported platforms.
    "pyyaml>=6.0.2",
    "pydantic>=2.0",
    "rich>=13.0",
    "qrcode>=7.4",
    "bcrypt>=4.0.0",
    # 50.0.0 fixes a high-severity PKCS#7 padding-oracle vulnerability pulled
    # in through mcp[crypto] -> pyjwt[crypto]. Keep fresh installs above it.
    "cryptography>=50.0.0",
    "tyro>=0.9.0",
    "mcp>=2.0.0,<3",
    "pyte>=0.8.2",
]

[project.urls]
Homepage = "https://github.com/lyehe/porterminal"
Repository = "https://github.com/lyehe/porterminal"
Documentation = "https://github.com/lyehe/porterminal/tree/master/docs"
Issues = "https://github.com/lyehe/porterminal/issues"

[project.scripts]
ptn = "porterminal:main"

[project.optional-dependencies]
dev = [
    "watchfiles>=0.21.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "porterminal/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["porterminal"]
artifacts = [
    "/porterminal/static/assets/*.js",
    "/porterminal/static/assets/*.css",
]

[tool.hatch.build.targets.sdist]
include = [
    "porterminal/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
artifacts = [
    "/porterminal/static/assets/*.js",
    "/porterminal/static/assets/*.css",
]

[tool.uv]
dev-dependencies = [
    "watchfiles>=0.21.0",
    "httpx>=0.28.0",
    "pre-commit>=4.0.0",
    "pyright>=1.1.400",
    "ruff>=0.8.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = [
    "porterminal",
    "scripts/verify_distribution.py",
]
exclude = ["porterminal/static", "porterminal/_version.py"]
reportMissingTypeStubs = "none"

[tool.coverage.run]
branch = true
source = ["porterminal"]

[tool.coverage.report]
show_missing = true

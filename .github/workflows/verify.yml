name: Verify project

on:
  workflow_call:
    inputs:
      upload_distribution:
        description: Upload the verified wheel and source distribution
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6

      - name: Install fish and nushell (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y fish
          curl -fsSL https://github.com/nushell/nushell/releases/download/0.101.0/nu-0.101.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv nu-0.101.0-x86_64-unknown-linux-gnu/nu /usr/local/bin/

      - name: Install fish and nushell (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install fish nushell

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Type check
        run: uv run --frozen pyright

      - name: Test
        run: uv run --frozen pytest

      - name: Verify CLI
        run: uv run --frozen ptn --help

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Test
        run: npm run test:run --prefix frontend

      - name: Type check tests
        run: npm run test:typecheck --prefix frontend

      - name: Build
        run: npm run build --prefix frontend

      - name: Verify packaged assets are current
        run: git diff --exit-code -- porterminal/static

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npm run test:browser --prefix frontend

  distribution:
    name: Distribution
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build distributions
        run: uv build

      - name: Verify fresh consumer installation
        run: uv run --frozen --python 3.12 python scripts/verify_distribution.py --python 3.12

      - name: Upload verified distributions
        if: inputs.upload_distribution
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

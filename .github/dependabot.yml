# Dependabot is configured for dependency security updates plus reviewed
# GitHub Actions SHA refreshes.
#
# `open-pull-requests-limit: 0` disables routine *version* update PRs for each
# ecosystem. Dependabot *security* updates (raised in response to security
# advisories) are unaffected by this limit and continue to flow - they have a
# separate, fixed cap of 10 open PRs.
#
# Net effect: Python and npm stay pinned to the exact lockfiles except for known
# vulnerabilities. Actions are pinned to immutable SHAs and receive small,
# reviewable monthly update PRs.
#
# REQUIRES (repo Settings -> Code security): "Dependabot alerts" AND
# "Dependabot security updates" must both be enabled - this file alone does not
# turn them on. Dependabot also reads this file from the DEFAULT branch
# (master), so changes only take effect once merged to master.
version: 2
updates:
  # Python dependencies (pip/uv) - security updates only
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
      - "security"
    open-pull-requests-limit: 0

  # npm dependencies (frontend) - security updates only
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "javascript"
      - "security"
    open-pull-requests-limit: 0

  # GitHub Actions - refresh immutable SHA pins through reviewed PRs
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5
